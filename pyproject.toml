[project]
name = "ytshorter"
version = "0.3.2"
description = "YouTube largo -> carpeta de shorts listos para subir (CLI-first UNIX, Gemini Flash, ffmpeg)"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.8.6",
  "youtube-transcript-api>=0.6.2",
  "google-genai>=1.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.24",
  "opencv-python-headless>=4.8,<5",
]

[project.scripts]
ytshorter = "ytshorter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
# Transcripción local sin subtítulos de YouTube (pesa: onnxruntime + ctranslate2).
# Imagen slim por defecto; full: podman build --build-arg WITH_LOCAL=1 .
local = ["faster-whisper>=1.0.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
